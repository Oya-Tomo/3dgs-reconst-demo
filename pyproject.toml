[project]
name = "3dgs-reconst-demo"
version = "0.1.0"
description = "Code-configured Nerfstudio 3D Gaussian Splatting training and local viewing demo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nerfstudio>=1.1.5,<1.2",
    # Nerfstudio main currently relies on the Pillow encoder API used before 12.0.
    "pillow>=11.3,<12",
    "pyyaml>=6.0.2,<7",
    "spectacularai[full]>=1.52.1,<2",
    "torch>=2.12.1,<2.13",
    "torchvision>=0.27.1,<0.28",
]

[dependency-groups]
dev = [
    "pyright>=1.1.403",
    "pytest>=8.4.1",
    "ruff>=0.12.7",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Nerfstudio 1.1.5 pins gsplat 1.4.0. Version 1.5 keeps the API used by
# Splatfacto while including newer CUDA build fixes.
override-dependencies = ["gsplat>=1.5.3,<2"]

[tool.uv.sources]
nerfstudio = { git = "https://github.com/nerfstudio-project/nerfstudio.git", branch = "main" }
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
